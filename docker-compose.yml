services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huwa_table_charm
      POSTGRES_USER: huwa
      POSTGRES_PASSWORD: huwa_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huwa -d huwa_table_charm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: huwa_table_charm
      DB_USER: huwa
      DB_PASSWORD: huwa_secret
      JWT_SECRET: change-me-in-production
      JWT_REFRESH_SECRET: change-me-refresh
      ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
