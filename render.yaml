# Review the paid resources before creating this Blueprint.
services:
  - type: web
    name: huwa
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: huwa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STATIC_DIR
        value: /workspace/frontend/dist
databases:
  - name: huwa-db
    databaseName: huwa
    user: huwa
    plan: free
    region: frankfurt
